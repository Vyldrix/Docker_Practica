# Indicamos la versión
version: '3.7'

# Iniciamos los servicios
services:
  # PHP
  php7:
    container_name: php7
    build: ./php
    volumes:
      - ../config/php:/usr/local/etc/php
      - ../code/myapp:/var/www/html/myapp
    depends_on:
      - mariadb
    networks:
      - red_ejem07

  # NGINX
  nginx:
    container_name: nginx
    image: nginx
    ports:
      - 8086:80
    volumes:
      - ../config/nginx:/etc/nginx/conf.d
      - ../code/myapp:/var/www/html/myapp
      - ../logs:/var/log/nginx
    depends_on:
      - php7
    networks:
      - red_ejem07

  # MARIADB
  mariadb:
    container_name: mariadb
    image: mariadb:latest
    volumes:
      - ../mariadb/data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=password
      - MYSQL_DATABASE=docker_sample
    ports:
      - 3306:3306
    networks:
      - red_ejem07

  # PHPMYADMIN
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    links:
      - 'mariadb:db'
    depends_on:
      - mariadb
    ports:
      - 8087:80
    networks:
      - red_ejem07

# Si queremos que tengan una red propia a otros contenedores
networks:
  red_ejem07:
    driver: bridge